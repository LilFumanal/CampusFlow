name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    # Base PostgreSQL éphémère, créée uniquement pour les tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: campusflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, mbstring, zip
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare test database
        env:
          APP_ENV: test
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/campusflow?serverVersion=16&charset=utf8
        run: |
          php bin/console doctrine:database:create --env=test --if-not-exists
          php bin/console doctrine:schema:create --env=test

      - name: Run tests
        env:
          APP_ENV: test
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/campusflow?serverVersion=16&charset=utf8
        run: php bin/phpunit


  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}
      repo_lower: ${{ steps.vars.outputs.repo_lower }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute variables
        id: vars
        run: |
          echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "repo_lower=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.vars.outputs.repo_lower }}:${{ steps.vars.outputs.sha_short }}
            ghcr.io/${{ steps.vars.outputs.repo_lower }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max


  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy deployment files
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "mkdir -p /opt/campusflow/docker/nginx"
          scp docker-compose.prod.yml ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/campusflow/
          scp docker/nginx/default.conf ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/campusflow/docker/nginx/

      - name: Generate .env.prod and deploy
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} bash -s <<'REMOTE'
          set -euo pipefail
          cd /opt/campusflow
          umask 077
          cat > .env.prod <<EOF
          APP_ENV=prod
          APP_SECRET=${{ secrets.APP_SECRET }}
          POSTGRES_USER=campusflow
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB=campusflow
          DATABASE_URL=postgresql://campusflow:${{ secrets.POSTGRES_PASSWORD }}@db:5432/campusflow?serverVersion=16
          GITHUB_REPOSITORY_LOWER=${{ needs.build-and-push.outputs.repo_lower }}
          IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
          EOF
          docker compose -f docker-compose.prod.yml --env-file .env.prod pull
          docker compose -f docker-compose.prod.yml --env-file .env.prod down
          docker volume rm campusflow_app_public || true
          docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --remove-orphans
          docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --wait db
          docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T app php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
          docker image prune -f
          REMOTE

      - name: Smoke test
        run: |
          for i in $(seq 1 12); do
            if curl -fsS -o /dev/null "http://${{ secrets.SSH_HOST }}:8090/demande"; then
              echo "App OK"; exit 0
            fi
            echo "Tentative $i/12 échouée, nouvelle tentative dans 5 s"
            sleep 5
          done
          echo "L'application ne répond pas" >&2
          exit 1